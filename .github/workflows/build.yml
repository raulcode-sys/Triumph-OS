name: Build Triumph OS ISO

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libmbedtls-dev grub-pc-bin grub-common xorriso fakeroot cpio gzip mtools

      - name: Copy kernel
        run: |
          mkdir -p iso/boot/grub
          sudo cp /boot/vmlinuz-$(uname -r) iso/boot/vmlinuz
          sudo chmod 644 iso/boot/vmlinuz

      - name: Copy kernel modules and firmware
        run: |
          KVER=$(uname -r)
          mkdir -p initramfs/lib/modules/$KVER/kernel/drivers
          # ethernet
          sudo cp -r /lib/modules/$KVER/kernel/drivers/net initramfs/lib/modules/$KVER/kernel/drivers/ 2>/dev/null || true
          # USB host controllers + tethering
          sudo cp -r /lib/modules/$KVER/kernel/drivers/usb initramfs/lib/modules/$KVER/kernel/drivers/ 2>/dev/null || true
          # sound
          sudo cp -r /lib/modules/$KVER/kernel/sound initramfs/lib/modules/$KVER/kernel/ 2>/dev/null || true
          # firmware
          sudo cp -r /lib/firmware initramfs/lib/firmware/ 2>/dev/null || true
          # module dependency files
          sudo cp /lib/modules/$KVER/modules.* initramfs/lib/modules/$KVER/ 2>/dev/null || true

      - name: Patch init.c module paths
        run: |
          KVER=$(uname -r)
          sed -i "s/6.8.0-111-generic/$KVER/g" init.c

      - name: Build
        run: make iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: triumph-os.iso
          path: triumph-os.iso
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: triumph-os.iso
